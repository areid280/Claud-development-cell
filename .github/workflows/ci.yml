name: ci

on:
  push:
    branches: [main]
  pull_request:

# CPU-only checks on a standard runner (cheap). GPU tests are skipped automatically.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Secret scan (simple)
        run: |
          if git grep -nIE "(BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})" -- . ':!.github/workflows/ci.yml'; then
            echo "Possible secret committed"; exit 1
          fi
