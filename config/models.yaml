# Model registry. One entry per candidate, grouped by role.
#
# RULES
# - licence / licence_note below are STARTING POINTS written during planning
#   and are NOT verified. The gatekeeper must read the real licence (code AND
#   weights, which can differ) at gate G1 before setting licence_ok: true.
# - Only the gatekeeper sets `selected: true` or `licence_ok: true`.
# - The owner is in the UK. Check territory clauses.
# - Non-commercial (NC) licences are fine for private experiments only.
#
# Fields: name, source (repo or HF id), install (pip/git), weights (HF id or URL),
#         licence, licence_note, vram_gb_est, selected, licence_ok, trial (T12–T15 fill this)

roles:
  pose:
    purpose: 2D whole-body keypoints for validation, cropping and measurement.
    candidates:
      - name: rtmlib-rtmw
        source: https://github.com/Tau-J/rtmlib
        install: pip install rtmlib onnxruntime-gpu
        weights: downloaded automatically by rtmlib
        licence: Apache-2.0 (claimed; VERIFY code and weights)
        licence_note: Lightweight ONNX; no mmcv needed.
        vram_gb_est: 2
        selected: false
        licence_ok: false
      - name: vitpose-hf
        source: https://huggingface.co/docs/transformers/model_doc/vitpose
        install: pip install transformers
        weights: usyd-community/vitpose-base-simple
        licence: Apache-2.0 (claimed; VERIFY)
        licence_note: Needs a person detector first (e.g. RT-DETR via transformers).
        vram_gb_est: 3
        selected: false
        licence_ok: false

  bg_remove:
    purpose: Person cut-out on transparent background.
    candidates:
      - name: birefnet
        source: https://github.com/ZhengPeng7/BiRefNet
        install: pip install transformers timm kornia
        weights: ZhengPeng7/BiRefNet
        licence: MIT (claimed; VERIFY)
        vram_gb_est: 4
        selected: false
        licence_ok: false
      - name: rembg
        source: https://github.com/danielgatis/rembg
        install: pip install "rembg[gpu]"
        weights: rembg session "u2net_human_seg" (auto-downloaded to $U2NET_HOME; E-003)
        licence: MIT code (claimed); u2net_human_seg weights from U-2-Net (Apache-2.0, claimed), trained on Supervisely Person data (dataset terms VERIFY at G1)
        vram_gb_est: 2
        selected: false
        licence_ok: false

  parsing:
    purpose: Per-part masks (hair, face, skin, each garment).
    candidates:
      - name: segformer-clothes
        source: https://huggingface.co/mattmdjaga/segformer_b2_clothes
        install: pip install transformers
        weights: mattmdjaga/segformer_b2_clothes
        licence: VERIFY (model card; trained on ATR dataset, check dataset terms)
        licence_note: Simple, fixed label set incl. hat, upper/lower clothes, shoes, belt, bag.
        vram_gb_est: 2
        selected: false
        licence_ok: false
      - name: florence2-plus-sam
        source: https://huggingface.co/microsoft/Florence-2-large ; https://huggingface.co/facebook/sam-vit-huge
        install: none beyond the models extra (transformers 4.x has SamModel; Florence-2 uses trust_remote_code)
        weights: microsoft/Florence-2-large ; facebook/sam-vit-huge
        licence: MIT (Florence-2) + Apache-2.0 (SAM v1) (claimed; VERIFY)
        licence_note_e007: SAM 2 (`sam2` package) needs torch>=2.5.1 and broke the pinned stack (E-007); revisit at G1.
        licence_note: Open vocabulary - finds 'collar', 'gloves', 'harness' etc. by text, SAM makes masks.
        vram_gb_est: 8
        selected: false
        licence_ok: false
      - name: sapiens-seg
        source: https://github.com/facebookresearch/sapiens
        install: torch only (TorchScript; no transformers model, no mmseg needed)
        weights: facebook/sapiens-seg-1b-torchscript
        licence: CC BY-NC 4.0 (checked 2026-10-08); acceptable under D-008 (non-commercial)
        licence_note: Very high quality human parsing; check licence carefully.
        vram_gb_est: 10
        selected: false
        licence_ok: false

  body_measure:
    purpose: Body shape -> measurements in cm (D-001). Body-model params never leave the wrapper.
    candidates:
      - name: keypoint-ratio
        source: in-house (src/avatar_forge/body/keypoint_ratio.py, written in T14)
        install: none
        weights: none
        licence: ours
        licence_note: Fallback. Uses pose keypoints + silhouette widths + user height. Lower accuracy, no licence risk.
        vram_gb_est: 0
        selected: false
        licence_ok: false
      - name: sam-3d-body
        source: https://github.com/facebookresearch/sam-3d-body
        install: see repo
        weights: see repo
        licence: VERIFY (Meta release; check code, weights and body-model licence)
        licence_note: Recent single-image human mesh recovery; measure circumferences by slicing the mesh.
        vram_gb_est: 12
        selected: false
        licence_ok: false
      - name: smpler-x
        source: https://github.com/caizhongang/SMPLer-X
        install: see repo
        weights: see repo (+ SMPL-X body model from smpl-x.is.tue.mpg.de)
        licence: VERIFY - SMPL-X body model is non-commercial by default
        licence_note: Good accuracy; licence likely limits commercial use.
        vram_gb_est: 8
        selected: false
        licence_ok: false

  image_to_3d:
    purpose: M2 fused mesh of the whole figure; M3 'generated' garments from masked crops.
    candidates:
      - name: trellis
        source: https://github.com/microsoft/TRELLIS
        install: see T15 card "Opus notes" (kaolin 0.17.0 wheel for torch-2.4.1_cu124; xformers backend)
        weights: microsoft/TRELLIS-image-large
        licence: MIT (claimed; VERIFY incl. any dependency with NVIDIA source licence)
        licence_note: Check for a newer TRELLIS release and compare at G1.
        vram_gb_est: 16
        selected: false
        licence_ok: false
      - name: hunyuan3d-2
        source: https://github.com/Tencent-Hunyuan/Hunyuan3D-2
        install: see repo
        weights: tencent/Hunyuan3D-2 (or newer)
        licence: 'EXCLUDED (D-009) - Tencent Hunyuan 3D 2.0 Community Licence "does not apply in the European Union, United Kingdom and South Korea" (checked 2026-10-08); owner is in the UK'
        licence_note: Do not install or trial.
        vram_gb_est: 16
        selected: false
        licence_ok: false
      - name: stable-fast-3d
        source: https://github.com/Stability-AI/stable-fast-3d
        install: see repo
        weights: "stabilityai/stable-fast-3d (gated - owner must accept the licence on Hugging Face; optional, D-009)"
        licence: VERIFY - Stability community licence (revenue thresholds)
        vram_gb_est: 8
        selected: false
        licence_ok: false
      - name: triposr
        source: https://github.com/VAST-AI-Research/TripoSR
        install: see T15 card "Opus notes" (clone to /opt/src/TripoSR; do NOT install its requirements.txt pins)
        weights: stabilityai/TripoSR
        licence: MIT (code + weights, Tripo AI & Stability AI; checked 2026-10-08)
        licence_note: Added by Opus (D-009) as an ungated, permissive baseline. Untextured vertex-colour mesh.
        vram_gb_est: 6
        selected: false
        licence_ok: false
